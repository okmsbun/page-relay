<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Page Relay</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png">
  <link rel="stylesheet" href="panel.css">
</head>

<body data-state="idle">
  <header class="header">
    <div class="brand">
      <img class="app-icon" src="assets/icons/icon-48.png"
        srcset="assets/icons/icon-48.png 1x, assets/icons/icon-128.png 2x" width="28" height="28" alt="">
      <h1>Page Relay</h1>
    </div>
    <button id="recapturePage" class="recapture-button" type="button" title="Capture the source page again" hidden
      disabled>
      <svg class="inline-icon recapture-icon" viewBox="0 0 16 16" aria-hidden="true">
        <path
          d="M2.5 5.25V4a1.5 1.5 0 0 1 1.5-1.5h1.25M10.75 2.5H12A1.5 1.5 0 0 1 13.5 4v1.25M13.5 10.75V12a1.5 1.5 0 0 1-1.5 1.5h-1.25M5.25 13.5H4A1.5 1.5 0 0 1 2.5 12v-1.25" />
        <circle cx="8" cy="8" r="2.25" />
      </svg>
      <span>Recapture</span>
    </button>
  </header>

  <main>
    <section id="sourceBar" class="source-bar" aria-label="Capture source" hidden>
      <div class="source-meta">
        <span class="source-badge">Source</span>
        <span id="sourcePage" class="source-page"></span>
      </div>
      <button id="captureActiveTab" class="capture-tab-button" type="button"
        title="Capture the currently active browser tab as the new source" hidden disabled>
        <svg class="inline-icon" viewBox="0 0 16 16" aria-hidden="true">
          <rect x="2" y="3" width="12" height="10" rx="2" />
          <path d="M2 6h12M8 8v3.5M6.25 9.75h3.5" />
        </svg>
        <span>Capture this tab</span>
      </button>
    </section>

    <section class="capture-status" aria-live="polite" aria-atomic="true">
      <span class="status-icon" aria-hidden="true">
        <svg viewBox="0 0 20 20">
          <path id="statusGlyph" d="M5 10l3 3 7-7" />
        </svg>
      </span>
      <div class="status-copy">
        <h2 id="statusTitle"></h2>
        <p id="statusDetail"></p>
        <p id="statusHint" class="status-hint"></p>
        <div id="statusActions" class="status-actions" hidden>
          <button id="statusRecapture" class="status-action-button primary" type="button" hidden>
            <svg class="inline-icon" viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M2.5 5.25V4a1.5 1.5 0 0 1 1.5-1.5h1.25M10.75 2.5H12A1.5 1.5 0 0 1 13.5 4v1.25M13.5 10.75V12a1.5 1.5 0 0 1-1.5 1.5h-1.25M5.25 13.5H4A1.5 1.5 0 0 1 2.5 12v-1.25" />
              <circle cx="8" cy="8" r="2.25" />
            </svg>
            <span>Recapture</span>
          </button>
          <button id="statusCaptureTab" class="status-action-button primary" type="button" hidden>
            <svg class="inline-icon" viewBox="0 0 16 16" aria-hidden="true">
              <rect x="2" y="3" width="12" height="10" rx="2" />
              <path d="M2 6h12M8 8v3.5M6.25 9.75h3.5" />
            </svg>
            <span>Capture this tab</span>
          </button>
        </div>
      </div>
    </section>
    <div id="captureProgress" class="progress-track" role="progressbar" aria-label="Capture progress" aria-valuemin="0"
      aria-valuemax="100" aria-valuenow="0" hidden>
      <div id="progressFill"></div>
    </div>

    <section class="preview-card" aria-label="Screenshot preview">
      <div id="previewToolbar" class="preview-toolbar" hidden>
        <span id="previewLabel" class="preview-label">
          <svg class="inline-icon" viewBox="0 0 16 16" aria-hidden="true">
            <rect x="2" y="3" width="12" height="10" rx="2" />
            <circle cx="5.75" cy="6.75" r="1.1" />
            <path d="M3.5 11.5l3.2-3 2.1 2 1.7-1.6 2 2.6" />
          </svg>
          Screenshot
        </span>
        <button id="zoomPreview" class="secondary-button zoom-button" type="button" aria-pressed="false"
          aria-label="Show screenshot at actual size">100%</button>
      </div>
      <div id="emptyState" class="empty-state">
        <div class="empty-glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <rect x="3.5" y="4.5" width="17" height="15" rx="3" />
            <path d="M7.5 9h9M7.5 12.5h6M7.5 16h4" />
          </svg>
        </div>
        <h2>Preparing preview…</h2>
      </div>
      <div id="previewViewport" class="preview-viewport" tabindex="0" aria-label="Scrollable screenshot preview" hidden>
        <img id="preview" alt="Captured full-page screenshot">
      </div>
      <div id="imageMeta" class="image-meta" hidden></div>
    </section>

    <details id="pageText" class="page-text" hidden>
      <summary>
        <span class="page-text-label">
          <svg class="inline-icon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M4 2.5h5.5L12.5 5.5v8a1 1 0 0 1-1 1h-7.5a1 1 0 0 1-1-1v-10a1 1 0 0 1 1-1z" />
            <path d="M9.5 2.5v3h3M5.5 8.5h5M5.5 11h3.5" />
          </svg>
          Page text
        </span>
        <span class="text-metrics"><span id="textCharacters" class="text-characters">0 chars</span></span>
        <svg class="text-chevron" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M4.5 6.25L8 9.75l3.5-3.5" />
        </svg>
      </summary>
      <div class="text-content">
        <pre id="textPreview" tabindex="0" aria-label="Extracted page text"></pre>
      </div>
    </details>

    <section id="destinations" class="destinations" aria-label="AI conversation destinations" hidden>
      <div class="destination-heading">
        <h2>Add to chat</h2>
        <button id="refreshDestinations" class="secondary-button refresh-button" type="button">
          <svg class="inline-icon refresh-icon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M13 8a5 5 0 1 1-1.35-3.42M13 3v2.5h-2.5" />
          </svg>
          <span>Refresh</span>
        </button>
      </div>
      <label class="include-page-text">
        <span class="include-copy">
          <span class="include-title">Include page text</span>
          <span class="include-tag">.txt</span>
        </span>
        <input id="includePageText" class="toggle-switch" type="checkbox">
      </label>
      <div id="providerTabs" class="provider-tabs" role="tablist" aria-label="AI providers"></div>
      <div id="noDestinations" class="no-destinations" hidden>
        <div class="empty-chats-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M5.5 6.5h13a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H10l-4.5 3v-3a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2z" />
          </svg>
        </div>
        <h3>No AI chats open</h3>
        <p>Open an AI conversation in Chrome, then refresh.</p>
      </div>
      <input id="destinationSearch" class="destination-search" type="search" placeholder="Find a conversation"
        aria-label="Find a conversation" hidden>
      <div id="destinationList" class="destination-list" role="tabpanel" tabindex="0" aria-label="Open conversations">
      </div>
      <div class="destination-actions">
        <p id="destinationNote" class="destination-note" role="status" aria-live="polite"></p>
        <button id="sendCapture" class="capture-button" type="button" disabled>Select conversations</button>
      </div>
    </section>
  </main>
  <script src="capture-layout.js"></script>
  <script src="ai-providers.js"></script>
  <script src="chat-destinations.js"></script>
  <script src="capture-preparation.js"></script>
  <script src="chatgpt-adapter.js"></script>
  <script src="claude-adapter.js"></script>
  <script src="gemini-adapter.js"></script>
  <script src="provider-delivery.js"></script>
  <script src="destinations-ui.js"></script>
  <script src="panel.js"></script>
  <script src="sidepanel-session.js"></script>
</body>

</html>
