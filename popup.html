<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <title>Page capture</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body data-state="idle">
  <header class="header">
    <div class="app-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M8 4H5a1 1 0 0 0-1 1v3m12-4h3a1 1 0 0 1 1 1v3M4 16v3a1 1 0 0 0 1 1h3m12-4v3a1 1 0 0 1-1 1h-3M8 9h8M8 12h8M8 15h5"/></svg>
    </div>
    <h1>Page capture</h1>
  </header>

  <main>
    <section class="preview-card" aria-label="Screenshot preview">
      <div id="previewToolbar" class="preview-toolbar" hidden>
        <span id="previewLabel">Screenshot</span>
        <button id="zoomPreview" class="zoom-button" type="button" aria-pressed="false" aria-label="Show screenshot at actual size">100%</button>
      </div>
      <div id="emptyState" class="empty-state">
        <h2>No capture</h2>
        <p>Capture the current page’s screenshot and text.</p>
      </div>
      <div id="previewViewport" class="preview-viewport" tabindex="0" aria-label="Scrollable screenshot preview" hidden>
        <img id="preview" alt="Captured full-page screenshot">
      </div>
      <div id="imageMeta" class="image-meta" hidden></div>
    </section>

    <details id="pageText" class="page-text" hidden>
      <summary><span>Page text</span><span class="text-metrics"><strong id="textTokens" title="Estimated at roughly 4 characters per token">~0 tokens</strong><span id="textCharacters" class="text-characters">0 chars</span></span><span class="text-chevron" aria-hidden="true">⌄</span></summary>
      <div class="text-content">
        <p class="text-estimate">Tokens are estimated at roughly 4 characters each.</p>
        <pre id="textPreview" tabindex="0" aria-label="Extracted page text"></pre>
      </div>
    </details>

    <section class="capture-status" aria-live="polite" aria-atomic="true">
      <span class="status-icon" aria-hidden="true">
        <svg viewBox="0 0 20 20"><path id="statusGlyph" d="M5 10l3 3 7-7"/></svg>
      </span>
      <div><h2 id="statusTitle"></h2>
        <p id="statusDetail"></p></div>
    </section>
    <div id="captureProgress" class="progress-track" role="progressbar" aria-label="Capture progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden>
      <div id="progressFill"></div>
    </div>

    <button id="takeScreenshot" class="capture-button" type="button">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6.5 5 8 3h4l1.5 2H16a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 16 17H4a1.5 1.5 0 0 1-1.5-1.5v-9A1.5 1.5 0 0 1 4 5h2.5Z"/><circle cx="10" cy="10.5" r="3"/></svg>
      <span id="buttonLabel">Capture page</span>
    </button>
    <section id="destinations" class="destinations" aria-label="AI conversation destinations" hidden>
      <div class="destination-heading"><h2>Send to</h2>
        <button id="refreshDestinations" class="zoom-button" type="button">Refresh</button></div>
      <input id="destinationSearch" class="destination-search" type="search" placeholder="Find a conversation" aria-label="Find a conversation" hidden>
      <div id="destinationList" class="destination-list" aria-label="Open conversations"></div>
      <p id="destinationNote" class="destination-note" role="status" aria-live="polite"></p>
      <button id="sendCapture" class="capture-button" type="button" disabled>Select conversations</button>
    </section>
  </main>
  <script src="capture-layout.js"></script>
  <script src="ai-providers.js"></script>
  <script src="chat-destinations.js"></script>
  <script src="chatgpt-adapter.js"></script>
  <script src="provider-delivery.js"></script>
  <script src="destinations-ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
