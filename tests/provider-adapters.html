<!doctype html>
<meta charset="utf-8">
<title>Claude and Gemini adapter regression checks</title>
<div id="fixture"></div>
<pre id="result" hidden>RUNNING</pre>
<script src="../claude-adapter.js"></script>
<script src="../gemini-adapter.js"></script>
<script>
  (async () => {
    // Accelerated fixture clock; production deadlines remain unchanged.
    const nativeNow = Date.now.bind(Date), nativeTimeout = setTimeout.bind(window);
    Date.now = () => nativeNow() * 100;
    window.setTimeout = (fn, ms) => nativeTimeout(fn, Math.max(1, ms / 100));
    const provider = new URLSearchParams(location.search).get("provider");
    const claude = provider === "claude";
    const submit = claude ? submitToClaude : submitToGemini;
    const checks = [];
    const assert = (condition, label) => { if (!condition) throw new Error(label); checks.push(label); };
    const fixture = document.getElementById("fixture");
    // Submission must be the site's own Send control: never a synthesized Enter/Return
    // (or any other key event), which could trigger Continue, retry or a duplicate send.
    const keyEvents = [];
    const nativeDispatch = EventTarget.prototype.dispatchEvent;
    EventTarget.prototype.dispatchEvent = function (event) {
      if (/^key(down|press|up)$/.test(event.type)) keyEvents.push(`${event.type}:${event.key}`);
      return nativeDispatch.call(this, event);
    };
    const canvas = document.createElement("canvas"); canvas.width = canvas.height = 8;
    const screenshot = canvas.toDataURL();
    let sequence = 0;
    async function run(mode) {
      fixture.innerHTML = claude
        ? '<div data-cds="ChatComposer"><div data-testid="chat-input" contenteditable="true" style="min-height:30px"></div><input data-testid="file-upload" type="file" multiple><div id="tiles"></div><button data-testid="chat-input-send">Send</button></div><div id="messages"></div>'
        : '<div data-node-type="input-area"><rich-textarea><div role="textbox" contenteditable="true" style="min-height:30px"></div></rich-textarea><div id="tiles"></div><gem-icon-button class="send-button submit"><button>Send</button></gem-icon-button><simplified-input-menu><button aria-haspopup="menu">Upload</button></simplified-input-menu></div><uploader><input type="file" multiple accept="image/*"><images-files-uploader><input type="file" multiple accept=".txt,.pdf"></images-files-uploader></uploader><div id="messages"></div>';
      let clicks = 0, changes = 0;
      const composer = () => fixture.querySelector('[contenteditable="true"]');
      const container = () => composer().closest(claude ? '[data-cds="ChatComposer"]' : '[data-node-type="input-area"]');
      const deliveryId = provider + '-' + (++sequence);
      const payload = {
        expectedUrl: location.origin + location.pathname + location.search, deliveryId, screenshot,
        text: "Original extracted page text\nRepeat\nRepeat", png: deliveryId + '.png', txt: deliveryId + '.txt',
        prompt: 'Captured context [' + deliveryId + ']\nSample page\nSee both attachments.'
      };
      const uploaded = [];
      for (const input of fixture.querySelectorAll('input[type="file"]')) input.addEventListener("change", () => {
        changes++;
        for (const file of input.files) {
          uploaded.push(file);
          const tile = document.createElement(claude ? "div" : "uploader-file-preview");
          if (claude) tile.dataset.testid = "file-thumbnail";
          const meta = document.createElement("span");
          meta.title = !claude && file.type === 'image/png' ? file.name.replace('.png', '_abc123.png') : file.name;
          tile.append(meta);
          if (file.type === 'image/png') { const img = document.createElement('img'); img.src = screenshot; tile.append(img); }
          fixture.querySelector('#tiles').append(tile);
        }
        input.value = "";
        if (mode === 'replacement') composer().replaceWith(composer().cloneNode(true));
        if (mode === 'edit') setTimeout(() => { composer().focus(); document.execCommand('insertText', false, 'User changed this draft'); }, 0);
        if (mode === 'upload-error') { const error = document.createElement('p'); error.setAttribute('role', 'alert'); error.textContent = 'Upload failed'; container().append(error); }
      });
      const send = fixture.querySelector(claude ? '[data-testid="chat-input-send"]' : 'gem-icon-button.send-button button');
      send.addEventListener('click', () => {
        clicks++;
        if (mode === 'unconfirmed') { composer().textContent = ''; return; }
        const turn = document.createElement(claude ? 'div' : 'user-query');
        if (claude) turn.dataset.cds = 'UserMessage';
        const message = document.createElement('div');
        if (claude) message.dataset.testid = 'user-message'; else message.className = 'query-text-line';
        message.textContent = composer().innerText; turn.append(message);
        if (mode !== 'partial') {
          if (claude) for (const tile of fixture.querySelector('#tiles').children) turn.append(tile.cloneNode(true));
          else {
            const image = document.createElement('img'); image.dataset.testId = 'uploaded-img'; image.src = screenshot; turn.append(image);
            const file = document.createElement('div'); file.dataset.testId = 'uploaded-file';
            const name = document.createElement('button'); name.setAttribute('aria-label', payload.txt); file.append(name); turn.append(file);
          }
        }
        fixture.querySelector('#messages').append(turn);
        composer().textContent = ''; fixture.querySelector('#tiles').replaceChildren();
      });
      if (mode === 'draft') composer().textContent = 'Preserve existing draft';
      if (mode === 'attachment') {
        const tile = document.createElement(claude ? 'div' : 'uploader-file-preview');
        if (claude) tile.dataset.testid = 'file-thumbnail'; fixture.querySelector('#tiles').append(tile);
      }
      if (mode === 'wrong-url') payload.expectedUrl += '/changed';
      if (mode === 'busy') {
        const stop = document.createElement('button');
        if (claude) stop.dataset.testid = 'stop-response'; else stop.className = 'stop-button';
        container().append(stop);
      }
      if (mode === 'consent' && !claude) fixture.append(document.createElement('upload-image-disclaimer-dialog'));
      const result = await submit(payload);
      return { result, clicks, changes, draft: composer().innerText, uploaded, payload };
    }
    try {
      const busy = await run('busy');
      assert(!busy.result.sent && busy.result.busy && busy.result.needsReview === false && !busy.changes && !busy.clicks && !busy.draft,
        'generation is busy before any upload, draft change, or send');
      assert(!window.__pageCaptureSending, 'busy detection leaves no send lock');
      const draft = await run('draft');
      assert(!draft.result.sent && !draft.result.needsReview && draft.draft === 'Preserve existing draft' && !draft.changes && !draft.clicks, 'existing text draft untouched with no upload or send');
      const attachment = await run('attachment');
      assert(!attachment.result.sent && !attachment.result.needsReview && !attachment.changes, 'existing attachments block preparation');
      const wrong = await run('wrong-url');
      assert(!wrong.result.sent && !wrong.changes && !wrong.clicks, 'changed destination rejected before mutation');
      if (!claude) { const consent = await run('consent'); assert(!consent.result.sent && !consent.changes, 'consent is never accepted automatically'); }
      const good = await run('replacement');
      assert(good.result.sent && good.clicks === 1, 'editor replacement still sends exactly once and confirms both files');
      assert(good.uploaded.length === 2 && good.uploaded[0].type === 'image/png' && good.uploaded[1].type === 'text/plain', 'PNG and full extracted text attached');
      assert(await good.uploaded[1].text() === good.payload.text, 'extracted text bytes preserved');
      for (const mode of ['edit', 'upload-error', 'unconfirmed', 'partial']) {
        const test = await run(mode);
        assert(!test.result.sent && test.result.needsReview && test.clicks <= 1, mode + ': uncertainty is never success or retried');
        assert(!test.result.busy, mode + ': post-mutation uncertainty is never retryable busy');
        if (mode === 'edit' || mode === 'upload-error') assert(test.clicks === 0, mode + ': never submits a changed or failed draft');
      }
      assert(!window.__pageCaptureSending, 'per-tab lock released');
      assert(keyEvents.length === 0, 'no key event is ever synthesized for submission (saw ' + keyEvents.join(', ') + ')');
      document.getElementById('result').textContent = 'PASS ' + JSON.stringify(checks);
    } catch (error) { document.getElementById('result').textContent = 'FAIL ' + error.message + ' ' + JSON.stringify(checks); }
  })();
</script>
