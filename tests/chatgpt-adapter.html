<!doctype html>
<meta charset="utf-8">
<title>ChatGPT UI adapter fixture</title>
<form>
  <div id="prompt-textarea" contenteditable="true" style="min-height:40px;border:1px solid"></div>
  <input type="file" multiple accept="image/png,text/plain">
  <div id="attachments"></div>
  <button data-testid="send-button" type="button">Send</button>
</form>
<div id="messages"></div>
<pre id="result" hidden>RUNNING</pre>
<script src="../chatgpt-adapter.js"></script>
<script>
(async () => {
  const checks = [];
  const assert = (ok, message) => { if (!ok) throw new Error(message); checks.push(message); };
  const composer = document.getElementById("prompt-textarea");
  const input = document.querySelector('input[type="file"]');
  const attachments = document.getElementById("attachments");
  let clicks = 0;
  input.addEventListener("change", () => {
    for (const file of input.files) {
      const chip = document.createElement("span"); chip.textContent = file.name; chip.title = file.name; attachments.append(chip);
    }
  });
  document.querySelector('[data-testid="send-button"]').addEventListener("click", () => {
    clicks++;
    const message = document.createElement("div");
    message.dataset.messageAuthorRole = "user";
    message.textContent = composer.innerText;
    document.getElementById("messages").append(message);
    composer.textContent = "";
  });
  const payload = { expectedUrl: `${location.origin}${location.pathname}${location.search}`,
    screenshot: "data:image/png;base64,aGVsbG8=", text: "Page text\nRevenue\nRevenue", prompt: "Captured page context [test-delivery]",
    png: "page-test.png", txt: "page-test.txt", deliveryId: "test-delivery" };
  try {
    const stop = document.createElement("button"); stop.dataset.testid = "stop-button";
    document.body.append(stop);
    const busy = await submitCaptureToComposer(payload);
    assert(!busy.sent && busy.busy && busy.needsReview === false && !input.files.length && clicks === 0 && !composer.innerText,
      "generation is busy with no draft mutation, uploads, or submission");
    assert(!window.__pageCaptureSending, "busy detection leaves no send lock");
    stop.remove();
    composer.textContent = "Existing draft";
    const draft = await submitCaptureToComposer(payload);
    assert(!draft.sent && !draft.needsReview && composer.innerText === "Existing draft", "existing draft is preserved");
    assert(!input.files.length && clicks === 0, "draft rejection uploads and submits nothing");
    composer.textContent = "";
    const changed = await submitCaptureToComposer({ ...payload, expectedUrl: "https://chatgpt.com/c/another" });
    assert(!changed.sent && clicks === 0, "changed destination rejected before upload");
    window.__pageCaptureSending = "another-delivery";
    const locked = await submitCaptureToComposer(payload);
    assert(!locked.sent && window.__pageCaptureSending === "another-delivery" && !input.files.length, "concurrent delivery does not alter another send or its lock");
    delete window.__pageCaptureSending;
    input.disabled = true;
    const unavailable = await submitCaptureToComposer(payload);
    assert(!unavailable.sent && !unavailable.needsReview && clicks === 0, "unavailable upload control fails without modifying the chat");
    input.disabled = false;
    const existingAttachment = document.createElement("button");
    existingAttachment.setAttribute("aria-label", "Remove attachment");
    attachments.append(existingAttachment);
    const attached = await submitCaptureToComposer(payload);
    assert(!attached.sent && !input.files.length, "existing attachment is preserved without adding files");
    existingAttachment.remove();
    const sent = await submitCaptureToComposer(payload);
    assert(sent.sent && clicks === 1, "submission occurs once and requires a new user message");
    assert(input.files.length === 2 && input.files[0].type === "image/png" && input.files[1].type === "text/plain", "PNG and text attached together");
    assert(await input.files[1].text() === payload.text, "extracted text transmitted without rewriting");
    assert(!window.__pageCaptureSending, "per-tab send lock released");
    input.value = "";
    attachments.replaceChildren();
    input.addEventListener("change", () => setTimeout(() => { composer.textContent = "User edited draft"; }, 0), { once: true });
    const edited = await submitCaptureToComposer({ ...payload, deliveryId: "edited-delivery", prompt: "Captured page context [edited-delivery]" });
    assert(!edited.sent && edited.needsReview && clicks === 1, "draft edited during upload is flagged for review without another submission");
    assert(composer.innerText === "User edited draft" && input.files.length === 2, "uncertain draft and attachments are left intact for review");
    document.getElementById("result").textContent = "PASS " + JSON.stringify(checks);
  } catch (error) {
    document.getElementById("result").textContent = "FAIL " + error.message + " " + JSON.stringify(checks);
  }
})();
</script>
