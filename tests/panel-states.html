<!doctype html>
<meta charset="utf-8">
<title>Side Panel sessions and provider tabs</title>
<style>
  body {
    margin: 0;
  }

  iframe {
    display: block;
    border: 0;
    width: 380px;
    height: 600px;
  }
</style>
<div id="frames"></div>
<pre id="result" hidden>RUNNING</pre>
<script>
  (async () => {
    const checks = [];
    const assert = (ok, label) => { if (!ok) throw new Error(label); checks.push(label); };
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const html = await (await fetch("../sidepanel.html")).text();
    const base = new URL("../", location.href).href;
    let sourceId = 1, captureCalls = [], captureSerial = 0, queries = 0, fail = false, discoveryFails = false, sourcePin = null, sourceActive = true, activationFails = false, transientActivationFails = 0, activatedTabs = [], consoleErrors = [];
    const tabMap = new Map([
      [1, { id: 1, windowId: 2, url: "https://github.com/org/repo", title: "org/repo", active: true }],
      [5, { id: 5, windowId: 2, url: "https://github.com/org/repo", title: "org/repo", active: true }],
      [7, { id: 7, windowId: 2, url: "https://docs.example.com/guide", title: "Guide Docs", active: false }],
      [8, { id: 8, windowId: 2, url: "chrome://extensions", title: "Extensions", active: false }],
    ]);
    let activeTabInWindow = 1;
    const chats = [
      { id: 10, windowId: 2, index: 1, title: "Extension debugging", url: "https://chatgpt.com/c/one", status: "complete", incognito: false },
      { id: 11, windowId: 3, index: 0, title: "Other discussion", url: "https://chatgpt.com/c/two", status: "complete", incognito: false },
      { id: 12, windowId: 4, index: 0, title: "Private discussion", url: "https://chatgpt.com/c/three", status: "complete", incognito: true },
      { id: 13, windowId: 3, index: 2, title: "Claude discussion", url: "https://claude.ai/chat/four", status: "complete", incognito: false },
      { id: 14, windowId: 4, index: 2, title: "Gemini discussion", url: "https://gemini.google.com/app/five", status: "complete", incognito: true },
    ];
    const image = document.createElement("canvas"); image.width = 960; image.height = 2600;
    const ctx = image.getContext("2d");
    ctx.fillStyle = "#edf0f6"; ctx.fillRect(0, 0, 960, 2600);
    ctx.fillStyle = "#242a3b"; ctx.fillRect(0, 0, 960, 150);
    ctx.fillStyle = "white"; ctx.font = "32px system-ui"; ctx.fillText("Sample page", 30, 90);
    for (let y = 200; y < 2500; y += 150) { ctx.fillStyle = "white"; ctx.fillRect(30, y, 900, 110); }
    const png = image.toDataURL();
    ctx.fillStyle = "#1d4ed8"; ctx.fillRect(0, 0, 960, 150);
    const pngUpdated = image.toDataURL();
    // Fixtures install mocks before the real sidepanel-session.js runs.
    window.configurePanelFixture = (win) => {
      const tabListeners = { activated: [], updated: [] };
      win.__emitTabActivated = (tabId, windowId = 2) => {
        activeTabInWindow = tabId;
        sourceActive = tabId === sourceId;
        for (const [id, entry] of tabMap) entry.active = id === tabId;
        for (const listener of tabListeners.activated) listener({ tabId, windowId });
      };
      win.__emitTabUpdated = (tabId, changeInfo) => {
        const entry = tabMap.get(tabId);
        if (entry) Object.assign(entry, changeInfo);
        for (const listener of tabListeners.updated) listener(tabId, changeInfo, entry);
      };
      const sourceTab = (id) => {
        const stored = tabMap.get(id);
        if (stored) return { ...stored, active: id === activeTabInWindow && sourceActive };
        return { id, windowId: 2, url: "https://github.com/org/repo", title: "org/repo", active: sourceActive };
      };
      win.console = { ...win.console, error: (...args) => consoleErrors.push(args) };
      win.chrome = {
        tabs: {
          onActivated: {
            addListener: (fn) => tabListeners.activated.push(fn),
            removeListener: (fn) => {
              const idx = tabListeners.activated.indexOf(fn);
              if (idx >= 0) tabListeners.activated.splice(idx, 1);
            },
          },
          onUpdated: {
            addListener: (fn) => tabListeners.updated.push(fn),
            removeListener: (fn) => {
              const idx = tabListeners.updated.indexOf(fn);
              if (idx >= 0) tabListeners.updated.splice(idx, 1);
            },
          },
          onRemoved: { addListener: () => {}, removeListener: () => {} },
          query: async (options) => {
            if (options.url) { if (discoveryFails) throw new Error("Test discovery error"); return chats; }
            if (sourceActive) {
              queries++;
              assert(options.windowId === 2, "capture source queried in the panel's own window");
              return [sourceTab(activeTabInWindow)];
            }
            const active = tabMap.get(activeTabInWindow);
            if (active && activeTabInWindow !== sourceId) return [{ ...active, active: true }];
            return [{ id: 999, windowId: 2, url: "https://chatgpt.com/c/other", title: "Other chat", active: true }];
          },
          get: async (id) => chats.find((tab) => tab.id === id) ?? sourceTab(id),
          update: async (id, options) => {
            if (transientActivationFails > 0) {
              transientActivationFails--;
              throw new Error("Tabs cannot be edited right now (user may be dragging a tab).");
            }
            if (activationFails) throw new Error("Tab cannot be activated");
            if (options.active) {
              activatedTabs.push(id);
              activeTabInWindow = id;
              sourceActive = true;
              sourceId = id;
            }
            return sourceTab(id);
          },
        }, scripting: { executeScript: async () => [{}] },
        storage: { session: { get: async (key) => (sourcePin ? { [key]: sourcePin } : {}) } },
        runtime: { getURL: (file) => `chrome-extension://testextensionid/${file}`, onMessage: { addListener: (listener) => { win.__onPanelMessage = listener; } } },
        windows: { getCurrent: async () => ({ id: 2 }), update: async () => ({ id: 2 }), onFocusChanged: { addListener: () => {} } },
        extension: { isAllowedIncognitoAccess: async () => true }
      };
      win.captureFullPage = async (tab) => {
        captureCalls.push(tab.id);
        const current = ++captureSerial;
        win.showProgress(0, 1, 0.5, 2);
        win.showTextStats({ characters: 400, estimatedTokens: 100 });
        await wait(150);
        if (fail === "interrupted") throw Object.assign(new Error("The page was manually scrolled during capture. Please keep the page still while capturing to ensure a complete screenshot."), { interrupted: true, interruptionReason: "manual-scroll", expected: true });
        if (fail === "tab-switch") throw Object.assign(new Error("Keep the captured tab active."), { interrupted: true, interruptionReason: "tab-switch", expected: true });
        if (fail === "tab-busy") throw Object.assign(new Error("Chrome tabs are temporarily busy."), { transientTab: true, interrupted: true, interruptionReason: "tab-busy", expected: true });
        if (fail === "layout") throw Object.assign(new Error("The page layout changed during capture. Wait for it to settle and retry."), { layoutChanged: true, diagnostic: { reason: "geometry-changed", diffs: ["viewportHeight: 800 -> 720"] } });
        if (fail === "unsupported") throw Object.assign(new Error("Full-page capture is unavailable on this type of page."), { unsupportedPage: true, expected: true });
        if (fail === "permission") throw new Error("Cannot access contents of the page. Extension manifest must request permission to access the respective host.");
        if (fail) throw new Error("Cannot access a chrome:// URL");
        return current > 1
          ? { screenshot: pngUpdated, text: "Updated capture text #" + current + "\nRevenue", characters: 31, estimatedTokens: 9, url: tab.url, title: tab.title }
          : { screenshot: png, text: "Hello <script>plain text<\/script>\nRevenue\nRevenue", characters: 49, estimatedTokens: 13, url: tab.url, title: tab.title };
      };
    };
    async function openPanel() {
      const frame = document.createElement("iframe");
      frame.title = "Side Panel UI under test";
      const loaded = new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
      frame.srcdoc = html.replace("<head>", '<head><base href="' + base + '">')
        .replace('<script src="sidepanel-session.js">', '<script>parent.configurePanelFixture(window)<\/script><script src="sidepanel-session.js">');
      document.getElementById("frames").replaceChildren(frame);
      await loaded;
      return { frame, win: frame.contentWindow, doc: frame.contentDocument };
    }
    try {
      let { frame, win, doc } = await openPanel();
      assert(!doc.getElementById("takeScreenshot"), "no initial capture button");
      assert(doc.getElementById("previewToolbar").hidden, "recapture toolbar hidden during initial capture");
      assert(doc.body.dataset.state === "capturing", "capture starts automatically on open");
      assert(doc.getElementById("statusDetail").textContent.includes("avoid scrolling"), "capturing guidance asks user to avoid scrolling");
      assert(doc.getElementById("destinations").hidden, "adding unavailable while capturing");
      assert(!doc.getElementById("captureProgress").hidden, "progress visible");
      assert(doc.getElementById("textCharacters").textContent === "400 chars", "live character count visible");
      assert(!doc.getElementById("textTokens") && !doc.querySelector(".text-estimate"), "token estimate removed");
      sourceId = 99;
      await win.startPanelCapture(Promise.resolve({ id: 99, windowId: 2 }));
      await wait(220);
      assert(captureCalls.join(",") === "1" && queries === 1, "source pinned once and duplicate startup ignored");
      assert(doc.body.dataset.state === "success", "automatic capture completes");
      assert(!doc.getElementById("sourceBar").hidden && doc.getElementById("sourcePage").textContent.includes("github.com"), "source bar displays the current capture source");
      assert(doc.getElementById("captureActiveTab").hidden, "Capture this tab stays hidden while on the current source tab");
      const includePageText = doc.getElementById("includePageText");
      assert(!includePageText.checked, "page text attachment defaults off");
      assert(doc.getElementById("emptyState").hidden && !doc.getElementById("previewViewport").hidden, "preview replaces placeholder");
      assert(doc.getElementById("imageMeta").textContent.includes("960"), "image dimensions displayed");
      assert(!doc.getElementById("pageText").open, "text starts collapsed");
      assert(doc.getElementById("textCharacters").textContent === "49 chars", "character count retained");
      doc.querySelector("#pageText summary").click();
      assert(doc.getElementById("pageText").open, "text expands");
      assert(doc.getElementById("textPreview").textContent.includes("<script>plain text<\/script>") && !doc.querySelector("#textPreview script"), "extracted text is safe literal content");
      doc.querySelector("#pageText summary").click();
      doc.getElementById("zoomPreview").click();
      assert(doc.getElementById("previewViewport").classList.contains("actual-size"), "actual-size preview works");
      doc.getElementById("zoomPreview").click();
      const chooseProvider = (id) => doc.getElementById("provider-" + id).click();
      if (location.search.includes("interaction")) {
        window.panelFixture = { frame, win, doc };
        document.getElementById("result").textContent = "PASS ready for native input";
        return;
      }
      assert(doc.querySelectorAll('[role="tab"]').length === 3, "horizontal tabs for discovered providers");
      assert(doc.querySelectorAll(".provider-icon").length === 3, "each provider has an icon");
      // Hit-test actual rendered padding/children, rather than calling the button's
      // .click() directly (which bypasses overlays and pointer-events).
      const clickPoint = (element, fx, fy) => {
        element.scrollIntoView({ block: "center", inline: "nearest" });
        const rect = element.getBoundingClientRect();
        const target = doc.elementFromPoint(rect.left + rect.width * fx, rect.top + rect.height * fy);
        assert(target === element || element.contains(target), "visible control owns its hit target");
        if (element.matches(".provider-tab")) assert(target === element, "provider children share the button's pointer target");
        target.click();
      };
      for (const provider of ["chatgpt", "claude", "gemini"]) {
        for (const [x, y] of [[0.03, 0.5], [0.97, 0.5], [0.5, 0.08], [0.5, 0.92], [0.3, 0.5]]) {
          chooseProvider(provider === "claude" ? "gemini" : "claude");
          clickPoint(doc.getElementById("provider-" + provider), x, y);
          assert(doc.getElementById("provider-" + provider).getAttribute("aria-selected") === "true", provider + ": padding and content select the entire tab");
        }
      }
      chooseProvider("chatgpt");
      assert(doc.getElementById("recapturePage") && !doc.getElementById("recapturePage").disabled, "recapture button is ready after capture");
      assert(doc.getElementById("destination-10").checked && !doc.getElementById("destination-11").checked, "first eligible conversation is selected by default");
      assert(!doc.getElementById("sendCapture").disabled && doc.getElementById("sendCapture").textContent === "Add screenshot", "Add screenshot is enabled immediately after capture");
      const row = doc.getElementById("destination-10").closest(".destination-row");
      clickPoint(row, 0.97, 0.5);
      assert(!doc.getElementById("destination-10").checked && doc.getElementById("sendCapture").disabled, "user can deselect the default conversation");
      doc.getElementById("refreshDestinations").click(); await wait(30);
      assert(!doc.getElementById("destination-10").checked && doc.getElementById("sendCapture").disabled, "refresh respects manual deselection instead of overriding it");
      const refreshedRow = doc.getElementById("destination-10").closest(".destination-row");
      clickPoint(refreshedRow, 0.97, 0.5);
      assert(doc.getElementById("destination-10").checked, "destination row empty space selects its checkbox");
      clickPoint(refreshedRow.querySelector(".destination-detail"), 0.5, 0.5);
      assert(!doc.getElementById("destination-10").checked, "destination detail toggles selection once");
      assert(doc.querySelectorAll(".destination-row input").length === 3, "only active provider conversations shown");
      assert(doc.getElementById("destinationList").textContent.includes("Incognito") && doc.getElementById("destinationList").textContent.includes("Other window"), "window and incognito labels retained");
      doc.getElementById("destination-10").click();
      chooseProvider("claude");
      assert(doc.querySelectorAll(".destination-row").length === 1 && !doc.getElementById("destination-13").disabled, "verified Claude is selectable");
      assert(!doc.querySelector(".destination-feedback.unavailable"), "verified Claude is not labelled unavailable");
      chooseProvider("gemini");
      assert(!doc.getElementById("destination-14").disabled, "verified Gemini is selectable");
      chooseProvider("chatgpt");
      assert(doc.getElementById("destination-10").checked, "selection survives provider switches");
      const pinnedImage = doc.getElementById("preview").src;
      const pinnedText = doc.getElementById("textPreview").textContent;
      frame.style.width = "300px"; await wait(20);
      assert(doc.documentElement.scrollWidth <= 300, "Side Panel UI fits a narrow panel without horizontal page overflow");
      frame.style.width = "480px"; await wait(20);
      assert(doc.getElementById("preview").src === pinnedImage && doc.getElementById("textPreview").textContent === pinnedText && captureCalls.length === 1 && doc.getElementById("destination-10").checked,
        "tab source changes and panel resizing preserve capture, text, and selection");
      frame.style.width = "380px";
      doc.getElementById("provider-chatgpt").dispatchEvent(new win.KeyboardEvent("keydown", { key: "ArrowRight", bubbles: true }));
      assert(doc.getElementById("provider-claude").getAttribute("aria-selected") === "true", "keyboard arrow changes provider");
      // The preparation is mocked below; this fixture never touches a real provider.
      doc.getElementById("refreshDestinations").click(); await wait(30);
      doc.getElementById("destination-13").click();
      chooseProvider("chatgpt"); doc.getElementById("destination-11").click();
      assert(doc.getElementById("sendCapture").textContent === "Add screenshot to 3 chats", "add count includes hidden providers");
      assert(doc.querySelector("#provider-claude .provider-count").textContent === "1", "hidden provider selection count remains visible");
      const badge = doc.querySelector("#provider-claude .provider-count");
      clickPoint(badge.closest("button"), 0.9, 0.5);
      assert(doc.getElementById("provider-claude").getAttribute("aria-selected") === "true", "count badge belongs to the full button target");
      chooseProvider("chatgpt");
      const search = doc.getElementById("destinationSearch");
      search.value = "Extension"; search.dispatchEvent(new win.Event("input"));
      assert(doc.querySelectorAll(".destination-row").length === 1, "search filters active provider without discarding selection");
      const deliveries = [];
      win.eval("destinationUI").configurePreparation(async (destination, capture, options) => {
        deliveries.push({ id: destination.id, ...options });
        assert(capture.screenshot === png && capture.text.includes("Revenue"), "identical screenshot and text added");
        assert(capture.includeText === true, "toggle enables TXT without a second capture");
        if (destination.id === 11) throw new Error("Test failure");
        return { prepared: true, delivered: [...(options?.includePng ? ["png"] : []), ...(options?.includeText ? ["txt"] : [])] };
      });
      assert(deliveries.length === 0, "selection alone never adds anything");
      includePageText.click();
      assert(doc.getElementById("sendCapture").textContent === "Add screenshot and text to 3 chats", "enabling page text updates primary CTA label");
      assert(captureCalls.join(",") === "1", "enabling page text does not recapture");
      doc.getElementById("sendCapture").click(); await wait(60);
      assert(deliveries.map((d) => d.id).sort((a, b) => a - b).join(",") === "10,11,13", "add includes selected conversations on hidden provider tabs");
      assert(doc.getElementById("destinationNote").textContent === "2 added to a chat draft · 1 failed", "partial results summarized across providers");
      chooseProvider("claude");
      assert(doc.querySelector(".destination-feedback.prepared").textContent === "Screenshot and text added", "hidden provider result retained with clear attachment label");
      chooseProvider("chatgpt");
      assert(doc.querySelector(".destination-feedback.failed") && doc.querySelector(".destination-feedback.prepared"), "independent results preserved");
      const protectedRow = doc.getElementById("destination-10").closest(".destination-row");
      protectedRow.click();
      assert(!doc.getElementById("destination-10").checked, "full-row interaction cannot select an already added destination");
      const failedSummary = doc.getElementById("destination-11").closest(".destination-row").querySelector("summary");
      failedSummary.click();
      assert(failedSummary.parentElement.open && doc.getElementById("destination-11").checked, "feedback expands without toggling conversation selection");
      assert(captureCalls.length === 1, "adding never recaptures the destination tab");
      const refresh = async () => { doc.getElementById("refreshDestinations").click(); await wait(30); };
      let generating = true;
      const retryCalls = [];
      win.eval("destinationUI").configurePreparation(async (destination, _cap, options) => {
        retryCalls.push({ id: destination.id, ...options });
        if (destination.id === 11 && generating) throw Object.assign(new Error("Generating a response. Nothing was added. Wait, then click Add again."), { busy: true, needsReview: false });
        return { prepared: true, delivered: [...(options?.includePng ? ["png"] : []), ...(options?.includeText ? ["txt"] : [])] };
      });
      chooseProvider("gemini"); doc.getElementById("destination-14").click();
      doc.getElementById("sendCapture").click(); await wait(60);
      assert(retryCalls.map((c) => c.id).join(",") === "11,14", "busy destination does not prevent other providers from being prepared");
      assert(doc.getElementById("destinationNote").textContent === "1 added to a chat draft · 1 busy (wait, then click Add again)", "busy is counted separately from failures");
      assert(doc.getElementById("provider-chatgpt").classList.contains("has-busy") && !doc.getElementById("provider-chatgpt").classList.contains("has-attention"), "hidden busy provider has a non-error indicator");
      chooseProvider("chatgpt");
      assert(doc.querySelector(".destination-feedback.busy summary").textContent.includes("Generating") && !doc.querySelector(".destination-feedback.failed"), "busy row is not labelled Failed");
      assert(doc.getElementById("destination-11").checked && !doc.getElementById("destination-11").disabled && !doc.getElementById("sendCapture").disabled, "busy destination stays selected and allows a manual retry");
      generating = false;
      await refresh(); await wait(60);
      assert(retryCalls.map((c) => c.id).join(",") === "11,14" && doc.querySelector(".destination-feedback.busy"), "refresh and elapsed time never automatically retry a busy chat");
      doc.getElementById("sendCapture").click(); await wait(60);
      assert(retryCalls.map((c) => c.id).join(",") === "11,14,11", "manual retry adds only the pending destination, never completed chats");
      assert(!doc.querySelector(".destination-feedback.busy") && doc.getElementById("destination-11").disabled, "successful retry clears busy state and prevents another preparation");
      assert(captureCalls.length === 1, "busy retry reuses the original capture");

      // Independent screenshot-first -> enable Include page text -> follow-up TXT-only & mixed multi-chat delivery.
      const originalChats = chats.slice();
      chats.splice(0, chats.length, originalChats[0], { id: 15, windowId: 3, index: 3, title: "Claude chat two", url: "https://claude.ai/chat/six", incognito: false });
      await refresh();
      assert(doc.querySelectorAll('[role="tab"]').length === 2 && doc.getElementById("provider-claude") && !doc.getElementById("provider-gemini"), "refresh removes closed providers and adds newly opened chats");
      chats.push(
        { id: 17, windowId: 3, index: 4, title: "DeepSeek chat", url: "https://chat.deepseek.com/a/chat/s/test", incognito: false },
        { id: 18, windowId: 3, index: 5, title: "Microsoft Copilot", url: "https://copilot.microsoft.com/chats/test", incognito: false },
        { id: 19, windowId: 3, index: 6, title: "DeepSeek site", url: "https://www.deepseek.com/en/", incognito: false });
      await refresh();
      assert(!doc.getElementById("provider-deepseek") && !doc.getElementById("provider-copilot"), "removed providers are never listed");
      assert(!doc.body.textContent.includes("Discovery only") && !doc.body.textContent.includes("not implemented"), "no partially implemented provider is exposed to users");
      chats.splice(chats.length - 3, 3);
      chats.push(originalChats[4]); await refresh();
      chooseProvider("gemini");
      assert(doc.getElementById("destination-14"), "new Gemini conversation appears after refresh");
      chats.pop(); await refresh();
      assert(!doc.getElementById("provider-gemini") && doc.querySelector('[role="tab"][aria-selected="true"]'), "closing active provider selects a remaining provider");
      chats.splice(0); await refresh();
      assert(!doc.getElementById("noDestinations").hidden && doc.getElementById("noDestinations").textContent.includes("No AI chats open"), "zero chats shows compact empty state");
      assert(doc.getElementById("providerTabs").hidden && doc.getElementById("destinationList").hidden && doc.getElementById("sendCapture").hidden && doc.getElementById("destinationSearch").hidden, "empty state hides tabs list search and Add");
      assert(!doc.getElementById("refreshDestinations").disabled, "empty state keeps Refresh available");
      discoveryFails = true; await refresh();
      assert(doc.getElementById("noDestinations").hidden && doc.getElementById("destinationNote").textContent.includes("Test discovery error"), "query failure is not misreported as no open chats");
      discoveryFails = false; chats.splice(0, chats.length, ...originalChats); await refresh();
      assert(!doc.getElementById("destinationList").hidden && doc.querySelectorAll('[role="tab"]').length === 3, "refresh recovers provider views after empty or failed discovery");
      chats.push({ id: 15, windowId: 2, index: 5, title: "Stalled Gemini", url: "https://gemini.google.com/app/stalled", status: "complete", incognito: false });
      await refresh(); chooseProvider("gemini");
      doc.getElementById("destination-15").click();
      let lateResult;
      win.eval("destinationUI").configurePreparation(() => new Promise((resolve) => { lateResult = resolve; }));
      const nativePanelTimeout = win.setTimeout.bind(win);
      win.setTimeout = (fn, ms) => nativePanelTimeout(fn, ms === 150000 ? 25 : ms);
      doc.getElementById("sendCapture").click();
      await wait(5);
      assert(doc.querySelector(".destination-feedback.preparing"), "pending preparation shows Adding");
      assert(doc.getElementById("recapturePage").disabled, "recapture is disabled while adding to chats");
      await wait(60);
      assert(!doc.querySelector(".destination-feedback.preparing") && doc.querySelector(".destination-feedback.review"), "stalled provider exits Adding with Needs review");
      assert(!doc.getElementById("recapturePage").disabled, "recapture re-enables once adding finishes");
      assert(doc.getElementById("destination-15").disabled && !doc.getElementById("refreshDestinations").disabled && !doc.getElementById("sendCapture").textContent.includes("Adding"), "timeout releases panel busy state while preventing duplicate preparation");
      lateResult({ prepared: true }); await wait(20);
      assert(doc.querySelector(".destination-feedback.review"), "late completion cannot overwrite the review result");
      await refresh();
      assert(doc.getElementById("destination-15").disabled, "refresh preserves duplicate protection after timeout");
      win.setTimeout = nativePanelTimeout;
      chats.pop();

      // Switching tabs while a capture exists distinguishes Captured source vs Active tab and surfaces Capture this tab without auto-capturing.
      win.__emitTabActivated(7, 2); await wait(30);
      assert(captureCalls.length === 1, "switching tabs never auto-captures");
      assert(!doc.getElementById("activeTabRow").hidden && doc.getElementById("activeTabLabel").textContent.includes("docs.example.com"), "active tab row clearly names the newly active tab separately from the captured source");
      assert(doc.getElementById("sourcePage").textContent.includes("github.com"), "captured source label stays clearly identified");
      assert(!doc.getElementById("captureActiveTab").hidden && !doc.getElementById("captureActiveTab").disabled, "Capture this tab becomes prominent on a different eligible tab");
      // Narrow panel width check with Active tab row and Capture this tab visible.
      frame.style.width = "300px"; await wait(20);
      assert(doc.documentElement.scrollWidth <= 300, "Source bar and Capture this tab fit 300px without horizontal overflow");
      frame.style.width = "380px";
      // If Capture this tab requires activeTab permission, show calm Page access required state (not red error), hide unusable button, preserve previous capture & toggle & delivery statuses, and continue automatically on toolbar click!
      doc.getElementById("includePageText").checked = true;
      fail = "permission";
      doc.getElementById("captureActiveTab").click(); await wait(220);
      assert(doc.body.dataset.state === "permission", "missing permission uses calm permission state instead of red error card");
      assert(doc.getElementById("statusTitle").textContent === "Page access required", "permission state displays Page access required heading");
      assert(doc.getElementById("statusDetail").textContent.includes("Page Relay icon") && doc.getElementById("statusHint").textContent.includes("previous capture is preserved"), "permission state explains toolbar action and reassures user previous capture is preserved");
      assert(doc.getElementById("captureActiveTab").hidden && doc.getElementById("activeTabStatus").textContent.includes("Toolbar click"), "unusable Capture this tab button is hidden for the ungranted tab");
      assert(doc.getElementById("preview").src === pinnedImage && doc.getElementById("sourcePage").textContent.includes("github.com") && !doc.getElementById("destinations").hidden && doc.getElementById("includePageText").checked, "permission state preserves previous capture, source, destinations, and page text toggle");
      // Clicking the toolbar icon while the Side Panel stays open automatically captures tab 7 in-place without closing/reloading!
      chooseProvider("chatgpt");
      fail = false;
      win.__onPanelMessage({ type: "captureSource:pinned", pinnedAt: Date.now() + 50, tab: { id: 7, windowId: 2, url: "https://docs.example.com/guide", title: "Guide Docs" } });
      await wait(240);
      assert(doc.body.dataset.state === "success" && captureCalls.at(-1) === 7, "toolbar click automatically captures the newly granted tab in-place");
      assert(doc.getElementById("sourcePage").textContent.includes("docs.example.com"), "source bar updates to the newly captured tab");
      assert(doc.getElementById("activeTabRow").hidden && doc.getElementById("captureActiveTab").hidden, "active tab row and Capture this tab hide once active tab becomes the source");
      assert(!doc.querySelector(".destination-feedback.prepared") && doc.getElementById("destination-10").checked, "Capture this tab resets delivery states and re-applies default selection");
      // Switching to another tab where permissions ARE already available captures directly in 1 click!
      win.__emitTabActivated(1, 2); await wait(30);
      assert(!doc.getElementById("captureActiveTab").hidden && doc.getElementById("activeTabLabel").textContent.includes("github.com"), "Capture this tab appears again on another eligible tab");
      doc.getElementById("captureActiveTab").click(); await wait(220);
      assert(doc.body.dataset.state === "success" && captureCalls.at(-1) === 1 && doc.getElementById("sourcePage").textContent.includes("github.com"), "Capture this tab captures directly when permissions are already available");
      // Switch back to tab 7 and capture it directly to continue follow-up tests on tab 7.
      win.__emitTabActivated(7, 2); await wait(30);
      doc.getElementById("captureActiveTab").click(); await wait(220);
      assert(doc.body.dataset.state === "success" && captureCalls.at(-1) === 7, "Capture this tab re-establishes tab 7 cleanly");
      // Screenshot-first -> enable Include page text -> TXT-only follow-up + mixed batch!
      const independentCalls = [];
      win.eval("destinationUI").configurePreparation(async (destination, _cap, options) => {
        independentCalls.push({ id: destination.id, ...options });
        return { prepared: true, delivered: [...(options?.includePng ? ["png"] : []), ...(options?.includeText ? ["txt"] : [])] };
      });
      assert(doc.getElementById("sendCapture").textContent === "Add screenshot", "fresh capture defaults to Add screenshot");
      doc.getElementById("sendCapture").click(); await wait(60);
      assert(independentCalls.length === 1 && independentCalls[0].includePng === true && independentCalls[0].includeText === false, "screenshot-only sends only PNG");
      assert(doc.getElementById("destination-10").disabled && doc.querySelector(".destination-feedback.prepared").textContent === "Screenshot added", "screenshot-only displays Screenshot added and disables row while text is off");
      // Enable Include page text -> destination 10 immediately becomes selectable for TXT-only!
      doc.getElementById("includePageText").click();
      assert(!doc.getElementById("destination-10").disabled && doc.querySelector(".destination-feedback.followup").textContent === "Ready for page text", "enabling page text re-enables screenshot-only chat for TXT follow-up");
      doc.getElementById("destination-10").click();
      assert(doc.getElementById("sendCapture").textContent === "Add page text", "selecting screenshot-only chat with text enabled shows Add page text");
      // Also select destination 11 (which needs both PNG+TXT) -> mixed batch!
      doc.getElementById("destination-11").click();
      assert(doc.getElementById("sendCapture").textContent === "Add to 2 chats", "mixed attachment needs show clear Add to N chats label");
      doc.getElementById("sendCapture").click(); await wait(60);
      assert(independentCalls.length === 3, "mixed batch delivered to both chats");
      assert(independentCalls[1].id === 10 && independentCalls[1].includePng === false && independentCalls[1].includeText === true, "follow-up chat receives ONLY TXT, never resends PNG");
      assert(independentCalls[2].id === 11 && independentCalls[2].includePng === true && independentCalls[2].includeText === true, "new chat in mixed batch receives PNG+TXT");
      assert(doc.getElementById("destination-10").disabled && doc.getElementById("destination-11").disabled, "both chats are disabled once screenshot and text are added");
      assert([...doc.querySelectorAll(".destination-feedback.prepared")].filter((n) => n.textContent === "Screenshot and text added").length === 2, "both chats display Screenshot and text added");

      // Switching tabs mid-Recapture interrupts calmly without switching back, preserving previous capture, delivery states, and active tab Capture this tab action!
      const activatedBeforeTabSwitch = activatedTabs.length;
      win.__emitTabActivated(1, 2); await wait(20);
      fail = "tab-switch";
      doc.getElementById("recapturePage").click();
      await wait(160);
      win.__emitTabActivated(1, 2);
      await wait(240);
      assert(doc.body.dataset.state === "interrupted", "tab switch during recapture shows calm interrupted state instead of red error");
      assert(doc.getElementById("statusTitle").textContent === "Capture interrupted", "tab switch interruption uses Capture interrupted heading");
      assert(doc.getElementById("statusDetail").textContent === "You switched tabs before the capture finished. Keep the source tab active during capture.", "tab switch interruption explains switching tabs clearly");
      assert(doc.getElementById("statusHint").textContent === "Your previous capture is preserved.", "tab switch interruption reassures user previous capture is preserved");
      assert(doc.getElementById("preview").src === pngUpdated && doc.getElementById("sourcePage").textContent.includes("docs.example.com") && !doc.getElementById("destinations").hidden, "tab switch interruption preserves previous screenshot, source, and destinations");
      assert(doc.querySelector(".destination-feedback.prepared") && !doc.getElementById("recapturePage").disabled, "tab switch interruption preserves delivery states and keeps Recapture accessible");
      assert(!doc.getElementById("activeTabRow").hidden && doc.getElementById("activeTabLabel").textContent.includes("github.com") && !doc.getElementById("captureActiveTab").hidden, "tab switch interruption preserves active tab info and Capture this tab");
      assert(activatedTabs.length === activatedBeforeTabSwitch + 1, "tab switch interruption never automatically switches the user back to the source tab after interruption");
      assert(consoleErrors.length === 0, "tab switch interruption does not pollute console.error");
      fail = false;

      // Subsequent Recapture operates on newly established source (tab 7), even from another tab!
      sourceId = 7;
      activeTabInWindow = 1;
      sourceActive = false;
      activationFails = true;
      doc.getElementById("recapturePage").click(); await wait(40);
      assert(doc.body.dataset.state === "error" && doc.getElementById("statusDetail").textContent.includes("switch back to the source tab"), "failed source activation gives actionable guidance");
      assert(!doc.getElementById("destinations").hidden && doc.getElementById("preview").src === pngUpdated, "failed recapture keeps existing capture and destinations");
      assert(consoleErrors.length === 0, "expected recapture error is not logged to extension error console");
      activationFails = false;
      sourceActive = false;
      transientActivationFails = 1;
      chooseProvider("chatgpt");
      chats[0] = { ...chats[0], discarded: true };
      const recaptureDeliveries = [];
      win.eval("destinationUI").configurePreparation(async (destination, capture) => {
        recaptureDeliveries.push([destination.id, capture.text]);
        return { prepared: true };
      });
      doc.getElementById("recapturePage").click();
      assert(doc.body.dataset.state === "capturing" && doc.getElementById("recapturePage").disabled && doc.getElementById("destinations").hidden, "recapture shows capturing state and prevents conflicting actions");
      await wait(650);
      assert(activatedTabs.at(-1) === 7 && sourceActive === true, "recapture automatically activates the newly established source tab 7 after transient tab lock");
      assert(captureCalls.at(-1) === 7, "recapture captures the newly established source tab");
      assert(doc.body.dataset.state === "success" && !doc.getElementById("recapturePage").disabled, "recapture completes cleanly");
      assert(doc.getElementById("preview").src === pngUpdated && doc.getElementById("textPreview").textContent.includes("Updated capture text"), "recapture replaces screenshot and extracted text");
      assert(!doc.getElementById("includePageText").checked, "recapture resets Include page text toggle");
      assert(!doc.querySelector(".destination-feedback.prepared") && !doc.querySelector(".destination-feedback.review"), "recapture resets delivery statuses");
      assert(doc.getElementById("destination-10").disabled && !doc.getElementById("destination-10").checked && doc.getElementById("destination-11").checked && doc.getElementById("sendCapture").textContent === "Add screenshot", "default selection skips unavailable conversations and enables Add screenshot");
      doc.getElementById("sendCapture").click(); await wait(60);
      assert(recaptureDeliveries.length === 1 && recaptureDeliveries[0][0] === 11 && recaptureDeliveries[0][1].includes("Updated capture text"), "recaptured content can be delivered without old duplicate blocks");
      chats[0] = { ...originalChats[0] };
      frame.remove();

      // Toolbar click pins source before panel opens; pin wins over active tab.
      captureSerial = 0;
      sourceId = 1;
      activeTabInWindow = 1;
      sourceActive = true;
      const queriesBeforePin = queries;
      sourcePin = { id: 5, windowId: 2, url: "https://github.com/org/repo", pinnedAt: Date.now() };
      ({ frame, win, doc } = await openPanel()); await wait(220);
      assert(!doc.getElementById("includePageText").checked, "new session resets page text toggle");
      assert(captureCalls.at(-1) === 5 && queries === queriesBeforePin, "reopening captures the tab pinned by the toolbar click");
      assert(!doc.getElementById("sendCapture").disabled && doc.getElementById("destination-10").checked && !doc.querySelector(".destination-feedback.prepared"), "new panel session resets results and applies default selection");
      win.eval("destinationUI").configurePreparation(async (_destination, capture) => {
        assert(capture.includeText === false && capture.text.includes("Revenue"), "default Add uses PNG mode while keeping collected text");
        return { prepared: true };
      });
      doc.getElementById("sendCapture").click(); await wait(60);
      assert(doc.querySelector(".destination-feedback.prepared"), "default Add completes with page text off");
      // Clicking the toolbar icon while the panel is open restarts the session on that tab.
      win.__onPanelMessage({ type: "captureSource:pinned" });
      await wait(500);
      win = frame.contentWindow; doc = frame.contentDocument;
      assert(captureCalls.slice(-2).join(",") === "5,5", "the toolbar icon restarts the session on the clicked tab");
      assert(doc.body.dataset.state === "success" && doc.getElementById("emptyState").hidden, "restarted session shows the new capture");
      if (location.search.includes("preview")) {
        document.getElementById("result").textContent = "PASS " + JSON.stringify(checks); return;
      }

      // Manual scroll interruption displays calm neutral interrupted state with prominent Recapture and zero console.error.
      sourcePin = null; fail = "interrupted"; sourceId = 1; activeTabInWindow = 1; sourceActive = true;
      frame.remove();
      ({ frame, win, doc } = await openPanel()); await wait(220);
      assert(doc.body.dataset.state === "interrupted", "manual scroll uses calm interrupted state instead of red error");
      assert(doc.getElementById("statusTitle").textContent === "Capture interrupted", "interrupted state shows Capture interrupted heading");
      assert(doc.getElementById("statusDetail").textContent.includes("manually scrolled"), "interrupted state explains manual scrolling clearly");
      assert(doc.querySelector(".preview-card").hidden, "interrupted state hides failed preview placeholder");
      assert(!doc.getElementById("statusRecapture").hidden && !doc.getElementById("statusRecapture").disabled, "interrupted state provides prominent Recapture action");
      assert(consoleErrors.length === 0, "manual scroll interruption does not pollute console.error");
      fail = false;
      doc.getElementById("statusRecapture").click(); await wait(220);
      assert(doc.body.dataset.state === "success" && !doc.getElementById("destinations").hidden, "clicking inline Recapture recovers cleanly from interrupted state");

      // Initial capture interrupted by switching tabs shows calm interrupted state with Recapture + Capture this tab for the new tab!
      sourcePin = { id: 1, windowId: 2, url: "https://github.com/org/repo", pinnedAt: Date.now() };
      fail = "tab-switch"; sourceId = 1; activeTabInWindow = 7; sourceActive = false;
      frame.remove();
      ({ frame, win, doc } = await openPanel()); await wait(220);
      assert(doc.body.dataset.state === "interrupted", "initial tab switch uses calm interrupted state instead of red error");
      assert(doc.getElementById("statusTitle").textContent === "Capture interrupted", "initial tab switch shows Capture interrupted heading");
      assert(doc.getElementById("statusDetail").textContent === "You switched tabs before the capture finished. Keep the source tab active during capture.", "initial tab switch explains switching tabs");
      assert(doc.querySelector(".preview-card").hidden, "initial tab switch hides failed preview placeholder");
      assert(!doc.getElementById("statusRecapture").hidden && !doc.getElementById("statusCaptureTab").hidden, "initial tab switch offers both Recapture and Capture this tab");
      assert(consoleErrors.length === 0, "initial tab switch interruption does not log console.error");
      fail = false;

      // Retryable initial capture failure keeps Recapture accessible, reports diagnostics, and succeeds on retry.
      sourcePin = null; fail = "layout"; sourceId = 1; activeTabInWindow = 1; sourceActive = true;
      frame.remove();
      ({ frame, win, doc } = await openPanel()); await wait(220);
      assert(doc.body.dataset.state === "error" && !doc.getElementById("recapturePage").hidden && !doc.getElementById("recapturePage").disabled, "retryable initial capture error keeps Recapture enabled");
      assert(doc.getElementById("statusDetail").textContent.includes("viewportHeight: 800 -> 720") && doc.getElementById("statusDetail").textContent.includes("Click Recapture"), "retryable capture error surfaces diagnostic cause and directs user to Recapture");
      assert(consoleErrors.length === 1 && consoleErrors[0][2]?.reason === "geometry-changed", "genuine unrecovered capture failures remain observable with structured diagnostics");
      consoleErrors.length = 0;
      fail = false;
      doc.getElementById("recapturePage").click(); await wait(220);
      assert(doc.body.dataset.state === "success" && !doc.getElementById("destinations").hidden, "clicking Recapture after failed initial capture succeeds");

      // Restricted page -> switch to eligible normal tab enables Capture this tab directly without closing the Side Panel!
      sourcePin = null; fail = true; sourceId = 8; activeTabInWindow = 8; sourceActive = true;
      frame.remove();
      ({ frame, win, doc } = await openPanel()); await wait(220);
      assert(doc.body.dataset.state === "restricted", "protected pages use the calm restricted state instead of error");
      assert(doc.getElementById("statusTitle").textContent === "Restricted page", "restricted page displays clear heading");
      assert(doc.getElementById("statusDetail").textContent.includes("security reasons") && doc.getElementById("statusHint").textContent.includes("Open another webpage"), "restricted page explains browser security limitation and next step");
      assert(doc.querySelector(".preview-card").hidden && doc.getElementById("recapturePage").hidden && doc.getElementById("statusCaptureTab").hidden, "restricted page hides failed preview placeholder and unusable buttons");
      assert(doc.getElementById("destinations").hidden && doc.getElementById("pageText").hidden, "restricted page hides unusable capture and delivery controls");
      // Now user switches to normal webpage tab 7 while Side Panel stays open!
      win.__emitTabActivated(7, 2); await wait(30);
      assert(!doc.getElementById("statusCaptureTab").hidden && !doc.getElementById("statusCaptureTab").disabled, "switching from restricted page to normal tab enables Capture this tab directly");
      assert(doc.getElementById("statusHint").textContent.includes("docs.example.com"), "restricted recovery hint names the newly active tab");
      fail = false;
      doc.getElementById("statusCaptureTab").click(); await wait(220);
      assert(doc.body.dataset.state === "success" && captureCalls.at(-1) === 7 && !doc.getElementById("destinations").hidden, "Capture this tab recovers cleanly from restricted state without closing Side Panel");

      // Unsupported non-web pages also use the calm informative state.
      fail = "unsupported"; sourceId = 8; activeTabInWindow = 8; sourceActive = true;
      frame.remove();
      ({ frame, win, doc } = await openPanel()); await wait(220);
      assert(doc.body.dataset.state === "restricted" && doc.getElementById("statusTitle").textContent === "Unsupported page", "unsupported pages use calm informative state");
      assert(doc.querySelector(".preview-card").hidden && doc.getElementById("recapturePage").hidden, "unsupported page hides unusable controls");
      // A missing grant on a normal page uses the calm Page access required state (never red error or restricted page).
      fail = "permission"; sourceId = 1; activeTabInWindow = 1; sourceActive = true;
      frame.remove();
      ({ frame, win, doc } = await openPanel()); await wait(220);
      assert(doc.body.dataset.state === "permission", "missing permission is displayed as calm permission state instead of red error");
      assert(doc.getElementById("statusTitle").textContent === "Page access required", "permission state shows Page access required heading");
      assert(doc.querySelector(".preview-card").hidden && doc.getElementById("recapturePage").hidden && doc.getElementById("statusCaptureTab").hidden, "permission state hides failed preview placeholder and unusable buttons");
      assert(!/restricted|security reasons/i.test(doc.getElementById("statusTitle").textContent + " " + doc.getElementById("statusDetail").textContent), "normal pages without permission are never reported as restricted");
      assert(doc.getElementById("statusDetail").textContent.includes("Page Relay icon") && doc.getElementById("statusHint").textContent.includes("No need to close the Side Panel"), "permission state explains toolbar click and automatic continuation");
      assert(consoleErrors.length === 0, "expected browser-boundary states do not pollute console.error");
      document.getElementById("result").textContent = "PASS " + JSON.stringify(checks);
    } catch (error) {
      document.getElementById("result").textContent = "FAIL " + error.message + " " + JSON.stringify(checks);
    }
  })();
</script>
